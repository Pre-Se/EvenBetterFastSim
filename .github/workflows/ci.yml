name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0            # Nerdbank.GitVersioning (in Directory.Build.props) wants full history

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # The app (Release) uses the public SecsGemBase NuGet packages — the same build the
      # release workflow ships. The test project references the app's Release output via a
      # glob, so the app must be built first, as its own dotnet invocation.
      - name: Build app (Release)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet build EvenBetterFastSim/EvenBetterFastSim.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw "Release build failed" }

      # Builds the test project against that Release output and runs the tests (no --no-build).
      - name: Test (Release)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet test EvenBetterFastSim.Tests/EvenBetterFastSim.Tests.csproj -c Release --verbosity normal
          if ($LASTEXITCODE -ne 0) { throw "Tests failed" }
