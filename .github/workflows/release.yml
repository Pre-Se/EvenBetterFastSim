name: Release

# Every push to main builds a self-contained, single-file Windows .exe
# and publishes it as a GitHub Release asset.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'specification/**'
      - '.obsidian/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0            # Nerdbank.GitVersioning needs full history

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Compute version (Nerdbank.GitVersioning)
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet tool install --global nbgv --version 3.9.50
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          $semver = nbgv get-version --variable SemVer2
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($semver)) { throw "nbgv failed to produce a version" }
          "semver=$semver"                       >> $env:GITHUB_OUTPUT
          "tag=v$semver"                         >> $env:GITHUB_OUTPUT
          "asset=EvenBetterFastSim-$semver.exe"  >> $env:GITHUB_OUTPUT
          "zipasset=EvenBetterFastSim-$semver.zip" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $semver"

      - name: Publish single-file exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish EvenBetterFastSim/EvenBetterFastSim.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=none `
            -o publish
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed" }
          Copy-Item publish/EvenBetterFastSim.exe "${{ steps.version.outputs.asset }}"

          # Bundle the exe together with the default library so users get a
          # working `Library\DefaultLibrary.msgpack` next to the exe.
          New-Item -ItemType Directory -Force -Path staging/Library | Out-Null
          Copy-Item publish/EvenBetterFastSim.exe staging/
          Copy-Item publish/Library/DefaultLibrary.msgpack staging/Library/
          Compress-Archive -Path staging/* -DestinationPath "${{ steps.version.outputs.zipasset }}"
          if ($LASTEXITCODE -ne 0) { throw "zip failed" }

      - name: Create / update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag   = "${{ steps.version.outputs.tag }}"
          $asset = "${{ steps.version.outputs.asset }}"
          $zipasset = "${{ steps.version.outputs.zipasset }}"

          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset,$zipasset --clobber
          } else {
            $ghArgs = @($tag, $asset, $zipasset, '--title', $tag, '--target', '${{ github.sha }}', '--generate-notes')
            if ("${{ steps.version.outputs.semver }}" -match '-') { $ghArgs += '--prerelease' }
            gh release create @ghArgs
          }
